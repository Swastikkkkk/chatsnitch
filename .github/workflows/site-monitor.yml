name: Site monitor

# Free replacement for synthetic monitoring. Runs every 6 hours and on demand.
# A failed run emails the repo owner by default.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/site-monitor.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: https://chatsnitch.vercel.app
      ZIP: https://github.com/Swastikkkkk/chatsnitch/releases/latest/download/chatsnitch.zip
      SUPABASE_URL: https://oceaylrebzflgyxfjqfb.supabase.co
      # Publishable key: safe to be public, can only call join_waitlist/track.
      SUPABASE_KEY: sb_publishable_6XZVSO2cS78UBwjFwVpoxw_CRywY421
    steps:
      - name: Landing page is up and is the real page
        run: |
          body=$(curl -fsSL --max-time 20 "$SITE/")
          echo "$body" | grep -q "<title>ChatSnitch</title>" || { echo "title missing"; exit 1; }
          echo "$body" | grep -q 'og:image' || { echo "og tags missing"; exit 1; }
          asset=$(echo "$body" | grep -oE 'assets/main-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$asset" ] || { echo "no JS bundle referenced"; exit 1; }
          curl -fsS --max-time 20 -o /dev/null "$SITE/$asset"
          echo "site ok ($asset)"
      - name: Link preview image
        run: |
          type=$(curl -fsS --max-time 20 -o /dev/null -w '%{content_type}' "$SITE/og.png")
          [ "$type" = "image/png" ] || { echo "og.png is $type"; exit 1; }
      - name: Release download works
        run: |
          curl -fsSL --max-time 30 -o ext.zip "$ZIP"
          unzip -p ext.zip manifest.json | grep -q '"management"' || { echo "zip doesn't look like ChatSnitch"; exit 1; }
          echo "zip ok ($(stat -c%s ext.zip) bytes)"
      - name: Backend responds and stays locked down
        run: |
          # Unknown slug: the RPC runs but writes nothing, so this never pollutes analytics.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/track" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"p_slug":"healthcheck","p_name":"ping"}')
          [ "$code" = "204" ] || { echo "track RPC returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SUPABASE_URL/rest/v1/waitlist?select=email&limit=1" -H "apikey: $SUPABASE_KEY")
          [ "$code" != "200" ] || { echo "waitlist is readable with the public key!"; exit 1; }
          echo "backend ok, waitlist not readable ($code)"
